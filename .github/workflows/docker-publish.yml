name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gridwise-optimizer:v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container health
        run: |
          docker run -d --name gridwise-smoke -p 8000:8000 \
            -e GEMINI_MODEL=gemini-3.5-flash \
            ${{ secrets.DOCKERHUB_USERNAME }}/gridwise-optimizer:v1
          trap 'docker logs gridwise-smoke; docker rm -f gridwise-smoke' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
