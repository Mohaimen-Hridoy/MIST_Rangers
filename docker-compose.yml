services:
  gridwise-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mist-rangers/gridwise-optimizer:latest
    container_name: gridwise-optimizer
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
    env_file:
      - path: backend/.env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
